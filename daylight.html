<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daylight: every claim, in the light</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f3f8;--surf:#fff;--ink:#231a33;--mute:#6a5f7d;--line:#e0d8ea;--acc:#5b2a86;--on-acc:#fff;--ok:#2f7d5b;--warn:#a8680f;--bad:#b3261e;--unk:#6a5f7d;--focus:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140e24;--surf:#1d1632;--ink:#ece6f6;--mute:#a79bc0;--line:#352b50;--acc:#c4a0f5;--on-acc:#150f27;--ok:#5fc29a;--warn:#f0b95b;--bad:#ff8a80;--unk:#a79bc0}}
:root[data-theme="dark"]{--bg:#140e24;--surf:#1d1632;--ink:#ece6f6;--mute:#a79bc0;--line:#352b50;--acc:#c4a0f5;--on-acc:#150f27;--ok:#5fc29a;--warn:#f0b95b;--bad:#ff8a80;--unk:#a79bc0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
h2{font-size:1.5rem;margin-bottom:6px}h3{font-size:1.15rem;margin-bottom:6px}

/* ---------- Sunrise header ---------- */
.sky{--p:0;position:relative;overflow:hidden;color:#fff;padding:22px 16px 112px;min-height:310px;
 background:linear-gradient(180deg,#171030 0%,#3d2466 38%,#b4543f 74%,#f0a259 100%);background-size:100% 300%;
 background-position:0 calc(var(--p)*100%);transition:background-position 3.5s ease}
.sky .wrap{position:relative;z-index:2}
.sunwrap{position:absolute;z-index:1;right:max(5%,calc(50% - 370px));bottom:calc(-180px + var(--p)*200px);width:130px;height:130px;transition:bottom 3s cubic-bezier(.25,.6,.2,1)}
.sun{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff6d2 0,#ffc86b 46%,#ff8a4c 100%);
 box-shadow:0 0 50px 16px rgba(255,170,100,.5),0 0 150px 60px rgba(236,104,110,.28);}
.rays{position:absolute;left:50%;top:50%;width:980px;height:980px;margin:-490px 0 0 -490px;pointer-events:none;
 background:repeating-conic-gradient(from 0deg,rgba(255,214,160,.17) 0 3deg,transparent 3deg 12deg);
 -webkit-mask-image:radial-gradient(circle,#000 6%,transparent 60%);mask-image:radial-gradient(circle,#000 6%,transparent 60%);
 animation:spin 180s linear infinite;opacity:clamp(0,calc((var(--p) - .6)*2.5),1);transition:opacity 2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.glow{position:absolute;z-index:1;left:0;right:0;bottom:0;height:62%;pointer-events:none;
 background:radial-gradient(ellipse 60% 90% at 82% 100%,rgba(255,112,128,.5),transparent 70%),linear-gradient(0deg,rgba(255,130,100,.38),transparent);
 opacity:clamp(0,calc(var(--p)*1.4),1);transition:opacity 2.5s}
.streak{position:absolute;z-index:1;height:5px;border-radius:5px;background:rgba(255,196,176,.38);filter:blur(2px);pointer-events:none;animation:drift 40s ease-in-out infinite alternate;opacity:clamp(0,calc((var(--p) - .4)*2),1);transition:opacity 2s}
.s1{left:8%;bottom:70px;width:210px}.s2{left:30%;bottom:46px;width:300px}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(34px)}}
@media(max-width:620px){.sunwrap{right:-24px;width:104px;height:104px}.rays{width:760px;height:760px;margin:-380px 0 0 -380px}}

@media(max-width:620px){.sky{padding-bottom:96px;min-height:280px}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:#fff;font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;padding:4px 12px;border-radius:999px;cursor:pointer;opacity:.75}
.lang button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#2b1850;opacity:1}
.lang button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sky h1{font-size:clamp(2.8rem,10vw,4.6rem);letter-spacing:-.02em;font-weight:400}
.sky h1 span{display:inline-block;animation:lit 1.7s ease both;animation-delay:calc(var(--i)*.16s + .5s)}
@keyframes lit{
 0%{color:#3a2c5c;opacity:.55;text-shadow:none}
 55%{color:#ffd8a0;opacity:1;text-shadow:0 0 22px rgba(255,190,120,.95)}
 100%{color:#fff;opacity:1;text-shadow:0 0 26px rgba(255,200,140,.35)}}
.sky .tag{max-width:46ch;margin:12px 0 0;opacity:.94;animation:fade 1.4s ease 1.6s both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:.94;transform:none}}
.s2{left:30%;bottom:46px;width:300px;animation-duration:55s}
@media (prefers-reduced-motion:reduce){.sky *,.sky{animation:none!important;transition:none!important}.sky h1 span{color:#fff}}

/* ---------- Layout ---------- */
.wrap{max-width:820px;margin:0 auto}
main{max-width:820px;margin:-34px auto 60px;padding:0 16px;position:relative;z-index:3}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:140px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--acc)}
.go{background:var(--acc);color:var(--on-acc)}
.ghost{background:none;color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mode{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute);margin-top:12px}
.cvreq{font-size:13px;color:var(--mute);margin:14px 0 6px}.cvreq b{color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin:6px 0 10px;background:var(--surf)}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.drop{position:relative;text-align:center;cursor:pointer;border:2px dashed var(--line);border-radius:12px;padding:22px 14px;margin:4px 0 12px;background:var(--surf);color:var(--mute);font-size:14px;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--acc)}
.drop:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.drop.loaded{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surf))}
.drop.bad{border-color:var(--bad)}
.drop.loaded .pick{background:none;color:var(--acc);border:1px solid var(--acc)}
.fname{display:block;font-weight:700;font-size:16px;color:var(--ink);margin:0 0 2px;word-break:break-all}
.fname::before{content:"✓";color:var(--ok);margin-right:8px}
.rm{position:relative;z-index:2;margin-top:10px;background:none;border:0;color:var(--mute);font-size:13px;font-weight:600;text-decoration:underline;padding:4px 8px}
.drop .pick{display:inline-block;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:8px 20px;font-weight:700;font-size:14px;margin-bottom:10px}
.drop #fileinfo{display:block}
details.pv{margin:0 0 12px;font-size:14px;color:var(--mute)}
details.pv pre{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin:8px 0 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}

/* ---------- Progress ---------- */
.steps{list-style:none;padding:0;margin:8px 0 0}
.steps li{display:flex;gap:10px;padding:5px 0;color:var(--mute)}
.steps li.on{color:var(--ink);font-weight:600}.steps li.done{color:var(--ink)}
.steps .ic{width:22px;text-align:center}
#clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 0}
.err{color:var(--bad);font-weight:600}
.hide{display:none}

/* ---------- Report ---------- */
.sum{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0}
.sum div{font-family:Georgia,serif;font-size:1.6rem}
.sum span{display:block;font:13px system-ui;color:var(--mute)}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s}
.muted{color:var(--mute);font-size:14px}
.claim{border-top:1px solid var(--line);padding:10px 0}
.claim summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start;list-style:none}
.claim summary::-webkit-details-marker{display:none}
.claim summary::after{content:"";flex:none;margin-left:auto;align-self:center;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);opacity:.55;transition:transform .15s}
.claim[open]>summary::after{transform:rotate(-135deg)}
.claim summary:hover::after{opacity:1}
.badge{flex:none;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-width:112px}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.verified{color:var(--ok)}.partial{color:var(--warn)}.contradicted{color:var(--bad)}.unverifiable{color:var(--unk)}
.ev{margin:8px 0 0 4px;padding-left:12px;border-left:3px solid var(--line);font-size:14px;color:var(--mute)}
.ev a{color:var(--acc);word-break:break-all}
.ev>div+div{margin-top:8px}
.warnbox{border-color:var(--warn);border-left-width:5px;color:var(--ink)}
.cand{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.cand h4{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.cand p{margin:4px 0 6px}.cand ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.cand a{color:var(--acc);word-break:break-all}
.cand .m{font-size:13px;color:var(--mute);font-weight:600}
.pill{display:inline-block;font-size:13px;font-weight:700;border:1px solid currentColor;border-radius:99px;padding:1px 10px;margin-left:8px;vertical-align:middle}
ul.plain,ol.plain{padding-left:20px;margin:6px 0}
table.li{border-collapse:collapse;width:100%;font-size:14px}
table.li th{text-align:left;padding:6px}
table.li td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>
<header class="sky" id="sky">
<div class="glow"></div><div class="streak s1"></div><div class="streak s2"></div>
<div class="sunwrap"><div class="rays"></div><div class="sun"></div></div>
<div class="wrap">
<div class="top"><span data-i="kicker"></span><div class="lang" role="group" aria-label="Language"><button type="button" id="l-en" aria-pressed="true">EN</button><button type="button" id="l-cs" aria-pressed="false">CS</button></div></div>
<h1 aria-label="Daylight" id="logo"></h1>
<p class="tag" data-i="tagline"></p>
</div>
</header>

<main>
<form class="card" id="form" autocomplete="off">
<div class="row">
<div><label for="name" data-i="lName"></label><input id="name" required data-ph="phName"></div>
<div><label for="ctx" data-i="lCtx"></label><input id="ctx" data-ph="phCtx"></div>
</div>
<label for="goal" data-i="lGoal"></label>
<input id="goal" data-ph="phGoal">
<p class="cvreq"><b data-i="cvReqB"></b> <span data-i="cvReq"></span></p>
<div class="seg" role="tablist"><button type="button" role="tab" id="tab-file" aria-selected="true" data-i="tabFile"></button><button type="button" role="tab" id="tab-text" aria-selected="false" data-i="tabText"></button></div>
<div id="pane-file">
<div class="drop" id="drop"><span class="pick" aria-hidden="true" data-i="pick"></span><input id="file" type="file" accept=".pdf,.docx,.md,.markdown,.html,.htm,.txt"><span class="fname hide" id="fname"></span><span id="fileinfo" aria-live="polite"></span><button type="button" class="rm hide" id="rm" data-i="remove"></button></div>
<details class="pv hide" id="pv"><summary data-i="showText"></summary><pre id="pvtext"></pre></details>
</div>
<div id="pane-text" class="hide">
<label for="cv" data-i="lCv"></label>
<textarea id="cv" data-ph="phCv"></textarea>
</div>
<p class="err hide" id="cverr" role="alert"></p>
<div class="actions">
<button class="go" id="run" type="submit" data-i="run"></button>
<button class="ghost" id="demo" type="button" data-i="demo"></button>
</div>
<span class="mode" id="mode"></span>
</form>

<section class="card hide" id="progress" aria-live="polite">
<h3 data-i="working"></h3>
<ul class="steps" id="steps"></ul>
<p id="clock"></p>
<p class="muted" id="timer"></p>
<p class="err hide" id="err"></p>
</section>

<section class="card hide" id="choice" aria-live="polite"></section>

<section class="hide" id="report"></section>
</main>

/* ======================= Report translation (calls the Actor in translate mode) ======================= */
function trCollect(r){
 const c=JSON.parse(JSON.stringify(r)),refs=[];
 const add=(o,k)=>{if(o&&typeof o[k]==="string"&&o[k].trim())refs.push([o,k])};
 add(c,"summary");add(c,"identityReason");
 (c.claims||[]).forEach(x=>{add(x,"text");add(x,"note")});
 (c.extraFindings||[]).forEach(x=>add(x,"text"));
 const p=c.profile||{};add(p,"headline");(p.timeline||[]).forEach(x=>add(x,"what"));(p.education||[]).forEach(x=>add(x,"what"));(p.publicPresence||[]).forEach(x=>add(x,"label"));
 ["flags","interviewQuestions","limitations"].forEach(k=>(c[k]||[]).forEach((_,i)=>add(c[k],i)));
 if(c.employmentStatus)add(c.employmentStatus,"detail");
 if(c.identityChoice)add(c.identityChoice,"label");
 return {texts:refs.map(([o,k])=>o[k]),apply(tr){refs.forEach(([o,k],i)=>{if(typeof tr[i]==="string"&&tr[i].trim())o[k]=tr[i]});return c}};
}
function setTrNote(msg,bad){
 let n=$("trnote");
 if(!msg){if(n)n.remove();$("report").style.opacity="";return}
 if(!n){n=document.createElement("div");n.id="trnote";n.className="card muted";$("report").prepend(n)}
 n.textContent=msg;n.style.color=bad?"var(--bad)":"";$("report").style.opacity=bad?"":".6";
}
async function refreshReport(){
 if(lastIsMock){show(mockReport(),true);return}
 if(!baseReport)return;
 if(reportCache[lang]){show(reportCache[lang],true);return}
 if(!live){show(baseReport,true);return}
 const my=++trSeq;show(baseReport,true);setTrNote(t("translating"));
 try{
  const col=trCollect(baseReport);
  const r=await fetch(`https://api.apify.com/v2/acts/${ACTOR_ID}/run-sync-get-dataset-items?token=${encodeURIComponent(APIFY_TOKEN)}&timeout=120`,
   {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({translateTexts:col.texts,language:lang})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();const out=Array.isArray(d)?d[0]:d;
  if(!out||!Array.isArray(out.translated)||out.translated.length!==col.texts.length)throw new Error("bad response");
  const tr=col.apply(out.translated);tr.meta=Object.assign({},tr.meta,{language:lang});
  reportCache[lang]=tr;
  if(my===trSeq&&lastReport)show(tr,true);
 }catch(e){if(my===trSeq)setTrNote(t("transFail"),true)}
}

async function runLive(extra){
 extra=extra||{};const t0=Date.now(),first=extra.cacheId?3:0;let delegated=false;renderSteps(first);
 const tick=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);$("clock").textContent="⏱ "+fmt(s);
  $("timer").textContent=t("timerHint")+(s>240?t("timerLong"):"");
  const S=t("steps"),k=Math.min(S.length-1,Math.max(first,Math.floor(s/30)));renderSteps(k);setP((k+1)/(S.length+1))},1000);
 try{
  const r=await fetch(`https://api.apify.com/v2/acts/${ACTOR_ID}/run-sync-get-dataset-items?token=${encodeURIComponent(APIFY_TOKEN)}&timeout=280`,
   {method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({name:$("name").value,context:$("ctx").value,goal:$("goal").value,cv:cvValue(),language:lang},extra))});
  if(!r.ok)throw new Error(t("eHttp")+r.status+(r.status===401?t("e401"):r.status===404?t("e404"):"."));
  const d=await r.json();const rep=Array.isArray(d)?d[0]:d;
  if(!rep)throw new Error(t("eNoData"));
  if(rep.error)throw new Error(t("eActor")+rep.error);
  if(rep.needsChoice){
   clearInterval(tick);delegated=true;
   const idx=await askChoice(rep.candidates||[]);
   return await runLive({cacheId:rep.cacheId,selectedCandidate:idx});
  }
  return rep;
 }finally{clearInterval(tick);if(!delegated)$("clock").textContent="✓ "+t("done")+fmt(Math.round((Date.now()-t0)/1000))}
}

const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/";
let mode="file",fileText="";
const cvValue=()=>mode==="file"?fileText:$("cv").value;
function setMode(m){
 mode=m;$("pane-file").classList.toggle("hide",m!=="file");$("pane-text").classList.toggle("hide",m!=="text");
 $("tab-file").setAttribute("aria-selected",m==="file");$("tab-text").setAttribute("aria-selected",m==="text");
 $("cverr").classList.add("hide");
}

$("cv").addEventListener("input",()=>$("cverr").classList.add("hide"));
let pdfjs=null;
async function readPdf(buf){
 if(!pdfjs){
  try{
   pdfjs=await import(PDFJS+"pdf.min.mjs");
   const w=await (await fetch(PDFJS+"pdf.worker.min.mjs")).text();
   pdfjs.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}));
  }catch(e){pdfjs=null;throw new Error(t("ePdf"))}
 }
 const pdf=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise,out=[];
 for(let i=1;i<=pdf.numPages;i++){
  const tc=await (await pdf.getPage(i)).getTextContent();let line="",y=null;
  for(const it of tc.items){
   if(typeof it.str!=="string")continue;
   const iy=it.transform[5];
   if(y!==null&&Math.abs(iy-y)>2&&line){out.push(line);line=""}
   line+=it.str;y=iy;
   if(it.hasEOL){out.push(line);line=""}
  }
  if(line)out.push(line);
 }
 return out.join("\n");
}
async function readDocx(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
 for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error(t("eDocx"));
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let k=0;k<n&&dv.getUint32(p,true)===0x02014b50;k++){
  const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  if(new TextDecoder().decode(u8.subarray(p+46,p+46+nl))==="word/document.xml"){
   const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.subarray(ds,ds+cs);let xml;
   if(method===0)xml=new TextDecoder().decode(data);
   else if(method===8&&typeof DecompressionStream==="function")xml=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
   else throw new Error(t("eZip"));
   const doc=new DOMParser().parseFromString(xml,"application/xml"),lines=[];
   for(const para of doc.getElementsByTagName("*")){
    if(para.localName!=="p")continue;let s="";
    for(const x of para.getElementsByTagName("*")){if(x.localName==="t")s+=x.textContent;else if(x.localName==="tab")s+="\t";else if(x.localName==="br"||x.localName==="cr")s+="\n"}
    lines.push(s);
   }
   return lines.join("\n");
  }
  p+=46+nl+el+cl;
 }
 throw new Error(t("eDocxEmpty"));
}
function readHtml(txt){
 const d=new DOMParser().parseFromString(txt,"text/html");
 d.querySelectorAll("script,style,head").forEach(x=>x.remove());
 d.querySelectorAll("br,p,div,li,tr,h1,h2,h3,h4,h5,h6,section,article,ul,ol,table").forEach(x=>x.append("\n"));
 d.querySelectorAll("td,th").forEach(x=>x.append(" "));
 return d.body?d.body.textContent:"";
}
function guessName(s){
 for(let l of s.split("\n")){l=l.replace(/^[\s#*\-]+|[\s#*]+$/g,"");if(!l)continue;
  if(l.length<=60&&l.split(/\s+/).length<=5&&!/[\d@:\/]/.test(l))return l;break}
 return "";
}
async function handleFile(f){
 if(!f)return;const ext=(f.name.split(".").pop()||"").toLowerCase();
 fileState={name:f.name,busy:true};setFileNote();fileText="";$("pv").classList.add("hide");
 try{
  let s;
  if(ext==="pdf")s=await readPdf(await f.arrayBuffer());
  else if(ext==="docx")s=await readDocx(await f.arrayBuffer());
  else if(["html","htm"].includes(ext))s=readHtml(await f.text());
  else if(["md","markdown","txt"].includes(ext))s=await f.text();
  else throw new Error(t("eFmt"));
  s=s.replace(/\r\n?/g,"\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  if(s.length<40)throw new Error(t("eEmpty"));
  fileText=s;$("pvtext").textContent=s;$("pv").classList.remove("hide");$("cverr").classList.add("hide");
  if(!$("name").value.trim()){const g=guessName(s);if(g)$("name").value=g}
  fileState={name:f.name,len:s.length};
 }catch(x){fileText="";$("pv").classList.add("hide");fileState={name:f.name,err:x.message||t("eRead")}}
 setFileNote();
}
$("rm").onclick=()=>{fileState=null;fileText="";$("file").value="";$("pv").classList.add("hide");setFileNote()};
$("file").onchange=()=>handleFile($("file").files[0]);
const dz=$("drop");
["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>handleFile(e.dataTransfer.files[0]));
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>e.preventDefault());

$("demo").onclick=()=>{setMode("text");$("name").value=t("demoName");$("ctx").value=t("demoCtx");$("goal").value=t("demoGoal");$("cv").value=t("demoCv")};

setInterval(()=>{const ok=cvValue().trim().length>=150;if(!running){$("run").disabled=!ok;$("run").title=ok?"":t("needCvTitle")}},300);
$("form").onsubmit=async e=>{
 e.preventDefault();
 const cvv=cvValue().trim();
 if(cvv.length<150){$("cverr").textContent=cvv?t("short"):(mode==="file"?t("needFile"):t("needText"));$("cverr").classList.remove("hide");return}
 running=true;$("run").disabled=true;$("report").classList.add("hide");$("choice").classList.add("hide");lastReport=null;baseReport=null;reportCache={};$("err").classList.add("hide");
 $("progress").classList.remove("hide");setP(0.12);renderSteps(0);$("clock").textContent=live?"⏱ 00:00":"";$("timer").textContent=live?"":t("simulated");
 try{
  let r;lastIsMock=!live;if(live){r=await runLive()}else{await runDemo();r=mockReport()}
  renderSteps(0,true);setP(1);baseReport=lastIsMock?null:r;reportCache={};if(!lastIsMock)reportCache[(r.meta&&r.meta.language)||lang]=r;show(r);
 }catch(x){$("err").textContent=x.message||"Error";$("err").classList.remove("hide");setP(0)}
 running=false;$("run").disabled=false;
};
applyLang();
</script>
